<div class="selector-sede">
  <label for="selector-sede">Sede</label>

  @if (cargando) {
    <p class="mensaje" role="status">Cargando sedes...</p>
  } @else if (error) {
    <p class="mensaje error" role="alert">{{ error }}</p>
    <button type="button" class="reintentar" (click)="reintentar.emit()">Reintentar</button>
  } @else {
    <select
      id="selector-sede"
      [value]="sedeSeleccionada?.idSede ?? ''"
      (change)="seleccionarSede($event)"
    >
      <option value="">Selecciona una sede</option>
      @for (sede of sedes; track sede.idSede) {
        <option [value]="sede.idSede">{{ sede.sigla }} — {{ sede.nombre }}</option>
      }
    </select>
  }
</div>
