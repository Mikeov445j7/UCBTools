<main class="page">
  <section class="demo">
    <p class="eyebrow">Framework institucional</p>
    <h1>{{ title }}</h1>
    <p class="description">
      Ejemplo de una herramienta reutilizable: selector de sedes conectado al servicio institucional.
    </p>

    <ucb-selector-sede (sedeChange)="sedeSeleccionada = $event" />

    @if (sedeSeleccionada; as sede) {
      <p class="selection" aria-live="polite">
        Seleccionaste <strong>{{ sede.nombre }}</strong> ({{ sede.sigla }}, ID {{ sede.idSede }}).
      </p>
    }
  </section>
</main>
